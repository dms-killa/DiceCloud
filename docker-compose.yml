version: '3.7'
services:
  dicecloud-db:
    container_name: dicecloud-db
    image: mongo:latest
    command:
      - --storageEngine=wiredTiger
    volumes:
      - ./dicecloud/data/db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=meteor
      - MONGO_INITDB_ROOT_PASSWORD=meteor
  dicecloud:
    container_name: dicecloud
    build:
      context: ./
    environment:
    #update ROOT_URL, PORT, and MAIL_URL for your environment
      - ROOT_URL=http://mediaroom.lan:4000
      - MONGO_URL=mongodb://meteor:meteor@dicecloud-db:27017/test?authSource=admin
      - PORT=3000
      - NODE_ENV=production
      - METEOR_SETTINGS={"public":{"environment":"production","disablePatreon":true}}
      - MAIL_URL=smtp://EMAIL:PASSWORD@SERVER:PORT
      - DEFAULT_LIBRARIES=dslPyPFcULEH4kKOE,wAb7GUFHJpzINOjvU
    ports:
      - '4000:3000' #The internal port should match the port set in the environmental variables
